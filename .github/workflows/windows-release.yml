name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release to users (otherwise it stays a draft)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: Fetch pinned Rust module
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout or application/dependency code runs with this write token.
      - name: Read own-repository draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p core-input/windows-x64
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/711430063" -H "Accept: application/octet-stream" > core-input/windows-x64/levik_core.node
          printf '%s\n' '5717403bbe02405c22f0720a34cb7332596a65cb0a7ed470a5f94c0a6b42bba3  core-input/windows-x64/levik_core.node' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: levik-core-pinned
          path: core-input/
          if-no-files-found: error
          retention-days: 1
  build:
    needs: core
    if: ${{ always() && (needs.core.result == 'success' || (github.event_name == 'pull_request' && needs.core.result == 'skipped')) }}
    name: Check and build installer
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false

      - name: Set a unique version for this build
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $parts = $package.version.Split('.')
          if ($parts.Length -ne 3) {
            throw "package.json version must use MAJOR.MINOR.PATCH"
          }
          $patch = [int]$parts[2] + [int]$env:GITHUB_RUN_NUMBER
          $version = "$($parts[0]).$($parts[1]).$patch"
          npm version --no-git-tag-version $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: npm run download:xray
      - run: npm run download:singbox
      - uses: actions/download-artifact@v4
        if: needs.core.result == 'success'
        with:
          name: levik-core-pinned
          path: vendor/levik-core
      - name: Verify pinned Rust module
        if: needs.core.result == 'success'
        run: npm run download:levik-core -- --verify-local
      - name: Optional Rust module for pull requests
        if: needs.core.result == 'skipped'
        run: npm run download:levik-core
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          LEVIK_TEST_CORE: ${{ needs.core.result == 'success' && format('{0}/vendor/levik-core/windows-x64/levik_core.node', github.workspace) || '' }}

      - name: Verify manual HotSwitch on the pinned Windows Xray
        run: node scripts/smoke-smart-auto-flows.mjs

      - name: Verify isolated Windows TUN Game datapath
        run: npm test -- tests/multipath/vlessOutbound.test.ts
        env:
          LEVIK_TEST_NATIVE_TUN: '1'

      - name: Build signed NSIS installer
        if: ${{ env.WINDOWS_CSC_LINK != '' }}
        run: npm run package:win
        env:
          CSC_LINK: ${{ env.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Build unsigned NSIS installer
        if: ${{ env.WINDOWS_CSC_LINK == '' }}
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Load bundled Rust core in Electron
        if: needs.core.result == 'success'
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $smoke = Start-Process -FilePath "./release/win-unpacked/Levik VPN.exe" -ArgumentList '"./scripts/smoke-bundled-core.cjs" "./release/win-unpacked/resources/levik-core/levik_core.node" "0.11.0"' -NoNewWindow -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Bundled Rust core did not load in Electron (exit $($smoke.ExitCode))" }

      - name: Prepare release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = "release/LevikVPN-Windows-$env:VERSION-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not created: $installer"
          }
          Copy-Item $installer "release/LevikVPN-Windows-x64.exe"
          Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: LevikVPN-Windows-${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: LevikVPN-Windows-${{ needs.build.outputs.version }}
          path: release

      - name: Create or refresh release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          # A push only prepares a draft; users get the update once it is published.
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk '/^## / {section++; next} section == 1 {print}' CHANGELOG.md > "$notes"
          test -s "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$COMMIT_SHA" \
              --title "Levik VPN для Windows ${VERSION}" \
              --notes-file "$notes" \
              --draft
          fi
          if [ "$PUBLISH" = "true" ]; then
            gh release edit "$tag" --notes-file "$notes" --draft=false --prerelease=false --latest
          else
            gh release edit "$tag" --notes-file "$notes"
            echo "Release $tag is a draft: publish it on GitHub or run this workflow with publish enabled."
          fi
